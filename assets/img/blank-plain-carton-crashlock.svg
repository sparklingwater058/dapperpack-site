  <text x="-107.2" y="-156.8" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="14" fill="#57504B">Two side panels, front and back in one strip with a glue flap. The base is four interlocking flaps: the side flaps are deepest, the front flap carries a V</text>
  <text x="-107.2" y="-133.8" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="14" fill="#57504B">notch that locks over them, and the back flap folds in last. Only the top carries tuck tabs. Only the tuck tabs are rounded — the outline and the base flaps</text>
  <text x="-107.2" y="-110.8" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="14" fill="#57504B">stay square, as a die would cut them.</text>
