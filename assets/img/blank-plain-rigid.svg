  <text x="-173.2" y="-208.2" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="14" fill="#57504B">Two pieces, drawn side by side: the lid on the left, the base on the right. Each is a face panel with a side on all four edges and a tuck-in strip inside every side; the</text>
  <text x="-173.2" y="-185.2" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="14" fill="#57504B">diagonal creases at the corners are where the side walls meet. The lid carries two finger holes so it can be lifted off. Nothing here is rounded — the outline is square,</text>
