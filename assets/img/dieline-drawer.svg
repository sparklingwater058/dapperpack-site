  <text x="-119.9" y="-325.4" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="14" fill="#57504B">Two pieces, drawn side by side. Left: the sleeve, folded from one strip with side flaps on two of its four panels and a glue flap on the end. Right: the tray that slides inside, with a tuck-in strip on each short side and a ribbon slot on one</text>
