  <text x="-107.2" y="-252.7" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="18" font-weight="700" fill="#1A1A1A">Book-style box — magnetic closing flap</text>
  <text x="-107.2" y="-229.7" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="14" fill="#57504B">Back cover, spine, front cover and the closing flap run as one strip. The flap folds over and is held by magnets set in the greyboard,</text>
  <text x="-107.2" y="-206.7" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="14" fill="#57504B">so there is no tuck tab. The two small circles mark where those magnets sit — they do not affect your artwork, they show where the box</text>
  <text x="-107.2" y="-183.7" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="14" fill="#57504B">closes. Side walls fold up on both long edges with a locking notch beside the spine. Nothing here is rounded except the magnet</text>
  <text x="-107.2" y="-160.7" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="14" fill="#57504B">positions, which are circles because a magnet is round.</text>
