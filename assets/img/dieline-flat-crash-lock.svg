  <text x="-107.2" y="-130.8" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="14" fill="#57504B">Two side panels, front and back in one strip with a glue flap. The base is four interlocking flaps: the side flaps are deepest, the front flap carries a V</text>
  <text x="-107.2" y="-107.8" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="14" fill="#57504B">notch that locks over them, and the back flap folds in last. Only the top carries a tuck tab. Every corner is rounded, as the die would cut it.</text>
