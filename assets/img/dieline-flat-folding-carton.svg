<svg xmlns="http://www.w3.org/2000/svg" viewBox="-95.0 -417.0 1131.0 1027.0" width="1131" height="1027" role="img" aria-labelledby="tfolding-carton dfolding-carton">
  <title id="tfolding-carton">Straight tuck end</title>
  <desc id="dfolding-carton">Flat dieline of a straight tuck end carton: Both tuck flaps hang off the front panel — that is what makes it straight. Each tuck has a lid portion that covers the opening and a narrower tab that tucks inside. The dust flaps are part of each side panel: full width at the crease, tapering inward, and short of half the box width so the two can never meet. Black solid lines are cut lines, red dashed lines are folds, green dashed is the 3 mm bleed; every panel and flap is labelled and dimensioned.</desc>
  <!-- 标题与说明（左对齐，独占上方一块） -->
  <text x="-79.00" y="-377.00" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="28.8" font-weight="700" fill="#1A1A1A" text-anchor="start">Straight tuck end</text>
  <text x="-79.00" y="-349.00" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="22.4" font-weight="600" fill="#57504B" text-anchor="start">Side, front, side, back and a glue flap in one strip. Both tuck flaps hang off the front panel —</text>
  <text x="-79.00" y="-326.00" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="22.4" font-weight="600" fill="#57504B" text-anchor="start">that is what makes it straight. Each tuck is a lid that covers the opening plus a narrower tab</text>
  <text x="-79.00" y="-303.00" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="22.4" font-weight="600" fill="#57504B" text-anchor="start">that tucks inside. The dust flaps belong to the side panels: full width at the crease, tapering</text>
  <text x="-79.00" y="-280.00" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="22.4" font-weight="600" fill="#57504B" text-anchor="start">inward, and short of half the box width so the two can never meet. Only the tuck tabs are</text>
  <text x="-79.00" y="-257.00" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="22.4" font-weight="600" fill="#57504B" text-anchor="start">rounded.</text>
