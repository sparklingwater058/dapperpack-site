  <text x="-173.2" y="-185.2" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="14" fill="#57504B">Two pieces, drawn side by side: the lid on the left, the base on the right. Each is a face panel with four sides and a tuck-in strip on every side; the diagonal creases at</text>
  <text x="-173.2" y="-162.2" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="14" fill="#57504B">the corners are where the side walls meet. The lid carries two finger holes so it can be lifted off. Every corner is rounded, as the die would cut it.</text>
