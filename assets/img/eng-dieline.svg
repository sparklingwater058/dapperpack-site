<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 880" width="1180" height="880" role="img" aria-labelledby="ttl dsc">
  <title id="ttl">Straight tuck-end carton — dieline</title>
  <desc id="dsc">Flat dieline of a straight tuck-end carton: four named panels (back, side, front, side), a glue flap, one tuck flap with shoulders on the front panel, four dust flaps on the two side panels, a bleed outline, dimension lines and a legend for cut lines, folds, bleed and print area.</desc>
