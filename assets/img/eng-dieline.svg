  <path d="M 110.0 158.0 L 110.0 250.0 L 202.0 250.0 L 202.0 158.0" fill="#F7F4EF" stroke="#8E1B2A" stroke-width="2"/>
  <path d="M 318.0 0.0 L 318.0 -92.0 L 410.0 -92.0 L 410.0 0.0" fill="#F7F4EF" stroke="#8E1B2A" stroke-width="2"/>
  <path d="M 318.0 158.0 L 318.0 250.0 L 410.0 250.0 L 410.0 158.0" fill="#F7F4EF" stroke="#8E1B2A" stroke-width="2"/>
