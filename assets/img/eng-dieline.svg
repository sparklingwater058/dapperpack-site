<svg xmlns="http://www.w3.org/2000/svg" viewBox="118 202 857 416" width="857" height="416" role="img" aria-labelledby="ttl dsc">
  <title id="ttl">Reverse tuck-end carton — dieline</title>
  <desc id="dsc">Flat dieline of a reverse tuck-end carton (top and bottom tucks close from opposite panels): four named panels (back, side, front, side), a glue flap, one tuck flap with shoulders on the front panel, four dust flaps on the two side panels, a bleed outline, dimension lines and a legend for cut lines, folds, bleed and print area.</desc>
