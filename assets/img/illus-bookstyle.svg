  <title id="ttl">Magnetic book-style rigid box</title>
  <desc id="dsc">Isometric drawing of a closed magnetic book-style rigid box: the outer wrap runs continuously from the back across the spine to the front closing flap, where the magnets sit, around a rigid inner tray. Gold bands mark the spine and the flap.</desc>
